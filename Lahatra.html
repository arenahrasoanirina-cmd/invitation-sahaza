<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un petit jeu tout mignon ♡</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#fffdfd;color:#281b21;font-family:Georgia,serif;overflow:hidden}
body:before{content:"୨୧  ♡  ୨୧  ♡  ୨୧  ♡";position:fixed;inset:0;color:#f8e8ef;font-size:35px;line-height:3;letter-spacing:12px;overflow-wrap:anywhere;z-index:-1}
.card{position:relative;width:min(100%,430px);min-height:560px;padding:28px 18px;text-align:center;background:#ffffffdf;border:1px solid #fae6ee;border-radius:28px;box-shadow:0 18px 55px #be779424}
.tiny{color:#c17a98;font:12px Arial;letter-spacing:2px;text-transform:uppercase}h1{font-size:30px;margin:18px 0 10px}.sub{font:14px Arial;color:#8b737d}.progress{display:flex;justify-content:center;gap:8px;margin:25px}.dot{width:7px;height:7px;border-radius:50%;background:#f2d7e2}.dot.active{background:#d8799e;transform:scale(1.3)}
.choices{display:flex;justify-content:center;gap:22px;margin:35px auto 20px}.choice{position:relative;border:1px solid #f4e4eb;background:#fff;border-radius:22px;width:135px;height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 7px 18px #be779417;transition:.18s}.choice:hover{transform:translateY(-4px);border-color:#e8a6bf}.emoji{font:58px "Apple Color Emoji","Segoe UI Emoji",sans-serif}.choice small{font:12px Arial;color:#9a7d89}.feedback{min-height:28px;font:14px Arial;color:#b84f70}.music{font:12px Arial;color:#b76b8a;min-height:18px}.wrong{position:absolute;inset:0;display:grid;place-items:center;color:#e32222;font:bold 100px Arial;background:#ffffff45;border-radius:22px}.ok{position:absolute;right:7px;top:6px;font:30px Arial}.btn{border:0;border-radius:30px;background:#eaa0bb;color:white;padding:13px 24px;cursor:pointer}.hidden{display:none!important}.heart{font-size:62px;margin:30px;animation:beat 1s infinite}.end{font-size:16px;line-height:1.7;color:#795765}.fall{position:fixed;top:-30px;animation:fall 4s linear forwards;pointer-events:none}.pointer-overlay{position:absolute;inset:0;z-index:5;background:#fffdf4ed;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.75);transition:opacity 7s,transform 7s;border-radius:28px}.pointer-overlay.show{opacity:1;transform:scale(1)}.pointer-hand{display:block;width:min(82%,260px);height:auto;max-height:72%;object-fit:contain;animation:pointBounce .55s ease-in-out infinite alternate}.pointer-kiss{position:absolute;right:7%;bottom:8%;font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:clamp(54px,15vw,82px);animation:kissBounce .8s ease-in-out infinite alternate}@keyframes pointBounce{from{transform:scale(1) translateX(-4px)}to{transform:scale(1.07) translateX(4px)}}@keyframes kissBounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-9px) rotate(5deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(250deg);opacity:0}}@keyframes beat{50%{transform:scale(1.12)}}@media(max-width:370px){.choice{width:120px;height:130px}.choices{gap:12px}.emoji{font-size:50px}}
</style></head><body><div id="hearts"></div><main class="card"><div class="tiny">un mini jeu pour toi ♡</div>
<section id="game"><div class="progress" id="progress"></div><h1 id="question"></h1><p class="sub" id="subtitle"></p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="music" id="music"></div></section>
<section id="ending" class="hidden"><div class="heart">💗</div><h1>Tu as trouvé !</h1><p class="end">Bravo toi ♡<br>J’espère que ce petit jeu t’a donné le sourire.<br><strong>Un petit bisou rien que pour toi 😘</strong></p><button class="btn" onclick="restart()">Rejouer ♡</button></section></main>
